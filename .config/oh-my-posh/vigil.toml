# oh-my-posh configuration file - vigil
# minimalistic single-line unix prompt using terminal-native base16 colors
# layout: host:path (git) [lang] +❯                                       5s

console_title_template = '{{ .HostName }}:{{ .Folder }}'
version = 3
final_space = true

[transient_prompt]
template = '{{ if .Root }}# {{ else }}❯ {{ end }}'
foreground = 'white'
background = 'transparent'
foreground_templates = ['{{ if or .Root (gt .Code 0) }}red{{ end }}']

[secondary_prompt]
template = '❯❯ '
foreground = 'darkGray'
background = 'transparent'

[upgrade]
source = 'cdn'
interval = '168h'
auto = false
notice = false

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = false

[[blocks.segments]]
type = 'session'
style = 'plain'
foreground = 'darkGray'
background = 'transparent'
template = '{{ if .Root }}<red>root</><darkGray>@</>{{ else if ne .UserName .Env.DEFAULT_USER }}<yellow>{{ (.UserName | splitList ".") | first }}</><darkGray>@</>{{ end }}{{ (.HostName | splitList "." | first | trimPrefix .Env.HOST_PREFIX) }}<darkGray>:</>'

[[blocks.segments]]
type = 'path'
style = 'plain'
foreground = 'blue'
background = 'transparent'
template = '{{ regexReplaceAll "(\\.?[^/]{1,3})[^/]*/" .Path "$1/" }}'

[blocks.segments.options]
style = 'full'
home_icon = '~'

[[blocks.segments]]
type = 'git'
style = 'plain'
foreground = 'green'
background = 'transparent'
template = ' <darkGray>(</>{{ .HEAD }}{{ if or (.Working.Changed) (.Staging.Changed) }}*{{ end }}{{ if gt .Behind 0 }}⇣{{ end }}{{ if gt .Ahead 0 }}⇡{{ end }}<darkGray>)</>'
foreground_templates = [
  '{{ if gt .Behind 0 }}red{{ end }}',
  '{{ if or (.Working.Changed) (.Staging.Changed) }}yellow{{ end }}',
  '{{ if gt .Ahead 0 }}lightYellow{{ end }}',
]

[blocks.segments.options]
branch_icon = ''
commit_icon = '@'
fetch_status = true
branch_template = '{{ trunc 16 .Branch }}'

[[blocks.segments]]
type = 'python'
style = 'plain'
foreground = 'magenta'
background = 'transparent'
template = ' <darkGray>[</>py{{ .Major }}{{ .Minor }}<darkGray>]</>'

[blocks.segments.options]
display_mode = 'context'
tooling = ['uv', 'python']

[[blocks.segments]]
type = 'go'
style = 'plain'
foreground = 'cyan'
background = 'transparent'
template = ' <darkGray>[</>go{{ .Major }}{{ .Minor }}<darkGray>]</>'

[blocks.segments.options]
display_mode = 'files'

[[blocks.segments]]
type = 'rust'
style = 'plain'
foreground = 'yellow'
background = 'transparent'
template = ' <darkGray>[</>rs{{ .Major }}{{ .Minor }}<darkGray>]</>'

[blocks.segments.options]
display_mode = 'files'

[[blocks.segments]]
type = 'status'
style = 'plain'
foreground = 'white'
background = 'transparent'
template = ' {{ if gt .Jobs 0 }}<yellow>+</>{{ end }}{{ if .Root }}#{{ else }}❯{{ end }}'
foreground_templates = ['{{ if or .Root (gt .Code 0) }}red{{ end }}']

[blocks.segments.options]
always_enabled = true

[[blocks]]
type = 'rprompt'
alignment = 'right'
overflow = 'hidden'

[[blocks.segments]]
type = 'executiontime'
style = 'plain'
foreground = 'darkGray'
background = 'transparent'
template = '{{ div .Ms 1000 }}s'

[blocks.segments.options]
threshold = 5000
