# tmux configuration

# general
if-shell '[ -x /usr/bin/zsh ]' 'set -g default-shell /usr/bin/zsh'
set -g prefix C-Space
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g history-limit 50000
set -g display-time 1000
set -g focus-events on
set -g escape-time 10
set -s extended-keys on
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB,*:usstyle,*:clipboard"

# mouse
set -g mouse on

# key bindings
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "✓ config reloaded"
bind c new-window -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind Tab last-window

# vi pane navigation, resize & copy-mode
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# pane dividers & messages (terminal-native base16 colors & transparent bg)
set -g pane-border-lines single
set -g pane-border-style "fg=brightblack,bg=default"
set -g pane-active-border-style "fg=white,bg=default"
set -g message-style "fg=yellow,bg=default"

# status bar (top, transparent bg, solid mode pill on left matching base16_transparent)
set -g status-position top
set -g status-style "fg=white,bg=default"
set -g window-status-separator ""

set -g status-left \
  "#{?client_prefix,#[fg=black]#[bg=red]#[bold] #S ,#[fg=black]#[bg=green]#[bold] #S }#[default] "

set -g window-status-current-format \
  "#[fg=blue,bg=default,bold] #I:#W#{?window_zoomed_flag,+,} #[default]"
set -g window-status-format \
  "#[fg=brightblack,bg=default] #I:#W#{?window_zoomed_flag,+,} #[default]"

set -g status-right \
  "#[fg=brightblack,bg=default]#{s|^$HOST_PREFIX||:host_short}#[default]"
