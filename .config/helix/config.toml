# helix configuration
theme = "base16_transparent"

[editor]
line-number = "absolute"
mouse = true
scrolloff = 5
color-modes = true
true-color = true
undercurl = true
end-of-line-diagnostics = "hint"
insert-final-newline = true
trim-final-newlines = true
trim-trailing-whitespace = true
bufferline = "multiple"

[editor.auto-save]
focus-lost = true

[editor.indent-guides]
render = true
character = "│"

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.file-picker]
hidden = false

[editor.statusline]
left = [
  "mode",
  "spinner",
  "version-control",
  "separator",
  "file-name",
  "read-only-indicator",
  "file-modification-indicator",
]
center = []
right = [
  "diagnostics",
  "workspace-diagnostics",
  "register",
  "selections",
  "primary-selection-length",
  "separator",
  "position",
  "position-percentage",
  "spacer",
  "separator",
  "file-indent-style",
  "file-encoding",
  "file-line-ending",
  "file-type",
]

[editor.statusline.mode]
normal = "NORMAL"
insert = "INSERT"
select = "SELECT"

[editor.lsp]
display-messages = true
display-inlay-hints = false

[editor.inline-diagnostics]
cursor-line = "warning"
other-lines = "error"

[editor.whitespace.render]
space = "none"
tab = "all"
newline = "none"

[editor.soft-wrap]
enable = true

[keys.normal]
C-left = "move_prev_word_start"
C-right = "move_next_word_end"
A-left = "move_prev_word_start"
A-right = "move_next_word_end"

[keys.select]
C-left = "extend_prev_word_start"
C-right = "extend_next_word_end"
A-left = "extend_prev_word_start"
A-right = "extend_next_word_end"

[keys.insert]
C-left = "move_prev_word_start"
C-right = "move_next_word_end"
A-left = "move_prev_word_start"
A-right = "move_next_word_end"
C-a = "goto_line_start"
C-e = "goto_line_end_newline"


